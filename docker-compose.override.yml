services:
############################## PROXY ########################################
  opencdmp.proxy:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.5'
    memswap_limit: 512M
    ports:
      - "${PROXY_APP_PORT}:8180"
    volumes:
      - ${CONFIG_FILES_PATH}/proxy/nginx.conf:/etc/nginx/nginx.conf
      - ${CONFIG_FILES_PATH}/proxy/ProxyNginx.conf:/etc/nginx/conf.d/default.conf
      - ${LOG_FILES_PATH}/proxy:/tmp/logs
    # Browsers resolve *.localhost to this machine on their own and treat it as a secure origin; the alias makes the
    # same URL reach the proxy from inside the containers, so the Keycloak issuer is identical on both sides.
    networks:
      opencdmp-proxy-network:
        aliases:
          - opencdmp.localhost
      opencdmp-backend-network:
        aliases:
          - opencdmp.localhost

############################## OPENCDMP APP #################################
  opencdmp.backend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1'
        reservations:
          memory: 1024M
          cpus: '0.5'
    memswap_limit: 4096M
    environment:
      - PROFILE=${PROFILE}
      - ELASTIC_PASS=${ELASTIC_API_PASSWORD}
    expose:
      - "8080"
    volumes:
      - ${CONFIG_FILES_PATH}/opencdmp/backend/config:/config
      - ${CONFIG_FILES_PATH}/opencdmp/backend/material:/material
      - ${STORAGE_PATH}/opencdmp/backend:/storage
      - ${LOG_FILES_PATH}/opencdmp/backend:/logs
    networks:
      - opencdmp-proxy-network
      - opencdmp-backend-network
    healthcheck:
     test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
     interval: 30s
     timeout: 10s
     retries: 3
     start_period: 120s

  opencdmp.frontend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1'
        reservations:
          memory: 1024M
          cpus: '0.5'
    memswap_limit: 4096M
    expose:
      - "8080"
    environment:
      - WEBAPP_API_URL=${WEBAPP_API_URL}
      - INSTALLATION_URL=${INSTALLATION_URL}
      - DEFAULT_CULTURE=${DEFAULT_CULTURE}
      - KEYCLOAK_ADDRESS=${KEYCLOAK_ADDRESS}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_SCOPE=${KEYCLOAK_SCOPE}
      - LOGGING_ENABLED=${LOGGING_ENABLED}
    volumes:
      # - ${CONFIG_FILES_PATH}/opencdmp/frontend/config-override.json:/usr/share/nginx/html/assets/config/config-override.json
      - ${CONFIG_FILES_PATH}/opencdmp/frontend/nginx.conf:/etc/nginx/nginx.conf
      - ${CONFIG_FILES_PATH}/opencdmp/frontend/WebAppNginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - opencdmp-proxy-network

  opencdmp.notification:
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    memswap_limit: 2048M
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PROFILE=${PROFILE}
    volumes:
      - ${CONFIG_FILES_PATH}/opencdmp/notification/config:/config
      - ${CONFIG_FILES_PATH}/opencdmp/notification/messages:/messages
      - ${CONFIG_FILES_PATH}/opencdmp/notification/notification_templates:/notification_templates
      - ${LOG_FILES_PATH}/opencdmp/notification:/logs
    networks:
      - opencdmp-proxy-network
      - opencdmp-backend-network

  opencdmp.annotation:
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    memswap_limit: 2048M
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PROFILE=${PROFILE}
    volumes:
      - ${CONFIG_FILES_PATH}/opencdmp/annotation/config:/config
      - ${CONFIG_FILES_PATH}/opencdmp/annotation/messages:/messages
      - ${LOG_FILES_PATH}/opencdmp/annotation:/logs
    networks:
      - opencdmp-proxy-network
      - opencdmp-backend-network

# # ############################## FILE-TRANSFORMER #################################

  opencdmp.file.transformer.docx:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.5'
    memswap_limit: 512M
    expose:
      - "8080"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - PROFILE=${PROFILE}
    volumes:
      - ${CONFIG_FILES_PATH}/opencdmp/file-transformer-docx/config:/config
      - ${LOG_FILES_PATH}/opencdmp/file-transformer-docx:/logs
      # - ${STORAGE_PATH}/opencdmp/file-transformer-docx:/storage
    networks:
      - opencdmp-backend-network
    healthcheck:
     test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
     interval: 30s
     timeout: 10s
     retries: 3
     start_period: 120s

  opencdmp.file.transformer.rdajson:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.5'
    memswap_limit: 512M
    expose:
      - "8080"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - PROFILE=${PROFILE}
    volumes:
      - ${CONFIG_FILES_PATH}/opencdmp/file-transformer-rda-json/config:/config
      - ${CONFIG_FILES_PATH}/opencdmp/file-transformer-rda-json/internal:/internal
      - ${LOG_FILES_PATH}/opencdmp/file-transformer-rda-json:/logs
      # - ${STORAGE_PATH}/opencdmp/file-transformer-rda-json:/storage
    networks:
      - opencdmp-backend-network
    healthcheck:
     test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
     interval: 30s
     timeout: 10s
     retries: 3
     start_period: 120s

###################################### EVALUATOR ##############################################

  opencdmp.evaluator:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.5'
    memswap_limit: 512M
    expose:
      - "8080"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - PROFILE=${PROFILE}
    volumes:
      - ${CONFIG_FILES_PATH}/opencdmp/evaluator-rda-madmp/config:/config
      - ${LOG_FILES_PATH}/opencdmp/evaluator-rda-madmp:/logs
    networks:
      - opencdmp-backend-network
    healthcheck:
     test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
     interval: 30s
     timeout: 10s
     retries: 3
     start_period: 120s

# ############################## ZENODO #######################################
  opencdmp.zenodo:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.5'
    memswap_limit: 512M
    expose:
      - "8080"
    environment:
      - PROFILE=${PROFILE}
    volumes:
      - ${CONFIG_FILES_PATH}/opencdmp/zenodo/config:/config
      - ${LOG_FILES_PATH}/opencdmp/zenodo:/logs
    networks:
      - opencdmp-backend-network
    healthcheck:
     test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
     interval: 30s
     timeout: 10s
     retries: 3
     start_period: 120s

################################# INIT ####################################
  # Docker creates missing bind-mount folders as root; Elasticsearch (1000:0) and Keycloak (1000) cannot write to those.
  opencdmp.init:
    user: "0"
    volumes:
      - ${STORAGE_PATH}:/storage
      - ${LOG_FILES_PATH}:/logs
    command: >
      bash -c '
        mkdir -p /storage/elasticsearch/plugins /logs/elasticsearch /logs/keycloak;
        chown -R 1000:0 /storage/elasticsearch /logs/elasticsearch;
        chown -R 1000 /logs/keycloak;
      '

################################# POSTGRES ####################################

  opencdmp.postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1'
        reservations:
          memory: 1024M
          cpus: '0.5'
    memswap_limit: 4096M
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    env_file:
      - ${CONFIG_FILES_PATH}/postgres/postgres.env
    volumes:
      - ${STORAGE_PATH}/postgres/data:/var/lib/postgresql/data
      - ${CONFIG_FILES_PATH}/postgres/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - opencdmp-backend-network
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d opencdmp'"]
      interval: 15s
      timeout: 60s
      retries: 5

################################# ELASTICSEARCH #################################################
  opencdmp.elasticsearch.setup:
    user: "0"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_API_PASSWORD=${ELASTIC_API_PASSWORD}
    volumes:
      - ${CONFIG_FILES_PATH}/elk/elasticsearch/index_init.sh:/usr/share/elasticsearch/config/index_init.sh
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        echo "Waiting for Elasticsearch availability";
        until curl -s http://opencdmp.elasticsearch:9200 | grep -q "missing authentication credentials"; do sleep 10; done;
        sed "s/\r$$//" /usr/share/elasticsearch/config/index_init.sh | bash;
        echo "All done!";
      '
    networks:
      - opencdmp-backend-network

  opencdmp.elasticsearch:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2'
        reservations:
          memory: 1024M
          cpus: '1'
    memswap_limit: 4096M
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      # Half the memory limit; Elasticsearch needs the rest for off-heap memory and the filesystem cache.
      - ES_JAVA_OPTS=-Xmx1g -Xms1g
    # The backend's index analyzers need analysis-icu; install it on first start, then start Elasticsearch as usual.
    command: >
      bash -c '
        bin/elasticsearch-plugin list | grep -q analysis-icu || bin/elasticsearch-plugin install --batch analysis-icu;
        exec /usr/local/bin/docker-entrypoint.sh eswrapper
      '
    ulimits:
      nproc: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${CONFIG_FILES_PATH}/elk/elasticsearch/log4j2.properties:/usr/share/elasticsearch/config/log4j2.properties:ro
      - ${CONFIG_FILES_PATH}/elk/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ${STORAGE_PATH}/elasticsearch/plugins:/usr/share/elasticsearch/plugins
      - ${STORAGE_PATH}/elasticsearch:/usr/share/elasticsearch/data
      - ${LOG_FILES_PATH}/elasticsearch:/usr/share/elasticsearch/logs
    expose:
      - "9200"
    networks:
      - opencdmp-backend-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

#################################### KEYCLOAK ###############################################
  opencdmp.keycloak:
    restart: unless-stopped
    # start-dev is for this local example only; production needs "start" with TLS and a hardened configuration.
    command: ["start-dev", "--log=console,file", "--log-file=/tmp/logs/keycloak.log", "--import-realm"]
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1'
        reservations:
          memory: 1024M
          cpus: '0.5'
    memswap_limit: 4096M
    env_file:
      - ${CONFIG_FILES_PATH}/keycloak/keycloak.env
    environment:
      - JAVA_OPTS_APPEND="-Djava.net.preferIPv4Stack=true"
    volumes:
      - ${LOG_FILES_PATH}/keycloak:/tmp/logs
      - ${CONFIG_FILES_PATH}/keycloak/imports/OpenCDMP-realm.json:/opt/keycloak/data/import/OpenCDMP-realm.json
    expose:
      - "8080"
    # The image has no curl; ask the management port with bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - opencdmp-proxy-network
      - opencdmp-backend-network

################################# RABBITMQ ###############################################
  opencdmp.rabbitmq:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.5'
    memswap_limit: 1024M
    restart: unless-stopped
    expose:
      - "5672"
    env_file:
      - ${CONFIG_FILES_PATH}/rabbitmq/rabbitmq.env
    volumes:
      - ${STORAGE_PATH}/rabbitmq:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - opencdmp-backend-network

################################# PDF SERVICE ##############################################
  opencdmp.pdf-service:
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1'
        reservations:
          memory: 1024M
          cpus: '0.5'
    memswap_limit: 4096M
    restart: unless-stopped
    expose:
     - "3000"
    hostname: pdf-service
    networks:
      - opencdmp-backend-network

networks:
  opencdmp-proxy-network:
  opencdmp-backend-network:
